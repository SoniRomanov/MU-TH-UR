name: Build Windows console
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --repeat until-fail:3
      - name: Package matching source
        run: git archive --format=zip --prefix=MU-TH-UR-source/ --output=build/MU-TH-UR-source.zip HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: MU-TH-UR-Windows
          path: |
            build/Release/MU-TH-UR.exe
            build/Release/assets/
            build/MU-TH-UR-source.zip
            LICENSE
            README.md
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = "build/MU-TH-UR-Windows"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item build/Release/MU-TH-UR.exe, LICENSE, README.md -Destination $package
          Copy-Item build/Release/assets -Destination "$package/assets" -Recurse
          Compress-Archive -Path "$package/*" -DestinationPath build/MU-TH-UR-Windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @"
          Looping background music, recorded keyboard sounds, and subtle CRT brightness flicker.

          The current story is prototype placeholder content and may change or be replaced.

          Download MU-TH-UR-Windows.zip, extract it, and run MU-TH-UR.exe. Keep the assets folder beside the executable.

          "@ | Set-Content build/release-notes.txt
          gh release create "$env:GITHUB_REF_NAME" build/MU-TH-UR-Windows.zip build/MU-TH-UR-source.zip --verify-tag --title "MU/TH/UR $env:GITHUB_REF_NAME" --notes-file build/release-notes.txt
